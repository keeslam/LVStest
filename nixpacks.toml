[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
# postgresql_17 must match the major version of the database server.
# pg_dump refuses to dump from a server newer than itself, so an unpinned
# "postgresql" that resolves to 16.x against a PostgreSQL 17 server makes every
# backup fail with:
#   pg_dump: error: server version: 17.x; pg_dump version: 16.x
# Bump this in step with the database.
nixPkgs = ["nodejs_20", "postgresql_17"]

[phases.install]
cmds = [
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p dist/server/public",
  "cp -r dist/public/* dist/server/public/"
]

[start]
# The migration is chained with || rather than && so a schema step that fails
# cannot stop the app from booting. Previously any failure aborted the chain,
# the container exited, Coolify restarted it, and it looped without ever
# serving traffic.
#
# db:push was REMOVED from this chain on 2026-08-30: drizzle-kit push rewrites
# the live database to match shared/schema.ts and is DESTRUCTIVE — it dropped
# columns the migration had just added and offered to TRUNCATE the vehicles
# table (411 rows) while adding the barcode unique constraint. In a TTY-less
# deploy it can apply such changes silently. startup-migration.js applies every
# schema change the app needs, additively and idempotently — it is the only
# schema step that belongs in production boot. Never add db:push back here.
cmd = "echo '=== CAR RENTAL MANAGER STARTING ===' && echo '=== RUNNING STARTUP MIGRATION ===' && (node startup-migration.js || echo '⚠️ startup migration reported errors — continuing') && echo '=== STARTING APPLICATION ===' && npm start"
