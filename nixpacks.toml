[variables]
NIXPACKS_NODE_VERSION = "20"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
# postgresql_17 must match the major version of the database server.
# pg_dump refuses to dump from a server newer than itself, so an unpinned
# "postgresql" that resolves to 16.x against a PostgreSQL 17 server makes every
# backup fail with:
#   pg_dump: error: server version: 17.x; pg_dump version: 16.x
# Bump this in step with the database.
nixPkgs = ["nodejs_20", "postgresql_17"]

[phases.install]
cmds = [
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "mkdir -p dist/server/public",
  "cp -r dist/public/* dist/server/public/"
]

[start]
cmd = "echo '=== CAR RENTAL MANAGER STARTING ===' && echo '=== RUNNING DATABASE PUSH ===' && npm run db:push && echo '=== DATABASE PUSH COMPLETED ===' && echo '=== RUNNING STARTUP MIGRATION ===' && node startup-migration.js && echo '=== MIGRATION COMPLETED ===' && echo '=== STARTING APPLICATION ===' && npm start"
